<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flexta Store — Simple One-File Shop</title>
  <style>
    :root{
      --brand:#FF6F00; --dark:#1f2937; --muted:#6b7280; --bg:#fff; --soft:#f9fafb;
    }
    *{box-sizing:border-box}
    body{margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,"Helvetica Neue",Arial; color:var(--dark); background:var(--soft);}
    a{color:inherit; text-decoration:none}
    .container{max-width:1120px; margin:0 auto; padding:16px}
    header{position:sticky; top:0; z-index:20; background:rgba(255,255,255,.9); backdrop-filter:blur(10px); border-bottom:1px solid #eee}
    .nav{display:flex; align-items:center; justify-content:space-between; padding:12px 16px}
    .brand{font-weight:700; font-size:22px; color:var(--brand)}
    .menu{display:flex; gap:16px}
    .btn{display:inline-flex; align-items:center; gap:8px; background:var(--dark); color:#fff; padding:10px 14px; border-radius:8px; border:none; cursor:pointer}
    .btn.light{background:var(--brand)}
    .grid{display:grid; gap:16px}
    .grid.products{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
    .card{background:#fff; border:1px solid #eee; border-radius:12px; overflow:hidden; transition:.2s transform, .2s box-shadow}
    .card:hover{transform:translateY(-2px); box-shadow:0 8px 24px rgba(17,24,39,.08)}
    .img{width:100%; aspect-ratio:4/3; background:linear-gradient(135deg,#fff4e6,#ffe8cc); display:flex; align-items:center; justify-content:center; color:var(--brand); font-weight:600}
    .p16{padding:16px}
    .price{color:var(--brand); font-weight:700}
    .muted{color:var(--muted)}
    .row{display:flex; gap:12px; align-items:center; flex-wrap:wrap}
    .field{border:1px solid #ddd; background:#fff; padding:10px 12px; border-radius:8px; width:100%}
    .hero{background:linear-gradient(90deg,#fff4e6,#fff); border:1px solid #ffe0b3; border-radius:16px; padding:24px}
    .pill{display:inline-block; background:#fff; border:1px solid #eee; padding:6px 10px; border-radius:999px}
    .footer{border-top:1px solid #eee; padding:24px; color:var(--muted); font-size:14px; background:#fff}
    .badge{font-size:12px; color:#fff; background:#ef4444; padding:4px 8px; border-radius:999px}
    .hidden{display:none}
    .section-title{font-weight:700; font-size:20px}
    .checkout{background:#fff; border:1px solid #eee; border-radius:12px; padding:16px}
    .divider{height:1px; background:#eee; margin:12px 0}
    @media (max-width:640px){ .menu{gap:8px} }
  </style>
</head>
<body>
  <header>
    <div class="nav container">
      <a class="brand" href="#" onclick="navigate('home')">Flexta</a>
      <div class="menu">
        <a href="#" onclick="navigate('products')" class="pill">Shop</a>
        <a href="#" onclick="navigate('cart')" class="pill">Cart (<span id="cartCount">0</span>)</a>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- Home -->
    <section id="page-home">
      <div class="hero">
        <h1 style="margin:0; font-size:28px; font-weight:800">Style that sells. Flexta.</h1>
        <p class="muted" style="margin-top:6px">Modern garments, minimalist looks—shop the latest drops.</p>
        <div class="row" style="margin-top:12px">
          <button class="btn light" onclick="navigate('products')">Shop now</button>
          <span class="pill">Free COD in Pakistan</span>
          <span class="pill">7-day returns</span>
        </div>
      </div>

      <h3 class="section-title" style="margin-top:24px">Featured</h3>
      <div class="grid products" id="featuredGrid"></div>
    </section>

    <!-- Products -->
    <section id="page-products" class="hidden">
      <div class="row" style="margin-bottom:12px">
        <input id="searchInput" class="field" placeholder="Search products..." oninput="renderProducts()" />
        <select id="catInput" class="field" onchange="renderProducts()">
          <option value="">All categories</option>
          <option>Garments</option>
          <option>Outerwear</option>
          <option>Bottoms</option>
        </select>
        <select id="sortInput" class="field" onchange="renderProducts()">
          <option value="new">Newest</option>
          <option value="low">Price: Low to High</option>
          <option value="high">Price: High to Low</option>
        </select>
      </div>
      <div class="grid products" id="productsGrid"></div>
    </section>

    <!-- Cart -->
    <section id="page-cart" class="hidden">
      <h3 class="section-title">Your cart</h3>
      <div id="cartList"></div>
      <div class="divider"></div>
      <div class="checkout">
        <h4 style="margin:0 0 8px 0;">Checkout (COD)</h4>
        <div class="row">
          <input id="name" class="field" placeholder="Full name" />
          <input id="phone" class="field" placeholder="Phone (e.g., 03xx-xxxxxxx)" />
          <input id="address" class="field" placeholder="Address" />
        </div>
        <div class="row" style="justify-content:space-between; margin-top:12px">
          <div><strong>Total: Rs <span id="cartTotal">0</span></strong></div>
          <button class="btn" onclick="placeOrder()">Place order</button>
        </div>
        <p class="muted" style="margin-top:8px">Cash on delivery. No payment needed now.</p>
      </div>
    </section>
  </main>

  <footer class="footer">
    © <span id="year"></span> Flexta. Built as a single-file demo.
  </footer>

  <script>
    // Sample products (you can edit/add more)
    const PRODUCTS = [
      { id:1, title:"Flexta Premium Cotton Tee", category:"Garments", price:1999, stock:50, badge:"New",
        images:["Tee"], desc:"Soft-touch cotton tee with modern fit." },
      { id:2, title:"Flexta Denim Jacket", category:"Outerwear", price:5499, stock:20, badge:"Hot",
        images:["Denim"], desc:"Classic denim with minimalist detailing." },
      { id:3, title:"Flexta Track Pants", category:"Bottoms", price:2999, stock:35,
        images:["Track"], desc:"Lightweight, tapered, everyday comfort." },
      { id:4, title:"Flexta Hoodie", category:"Outerwear", price:3999, stock:25,
        images:["Hoodie"], desc:"Cozy fleece hoodie, clean silhouette." },
      { id:5, title:"Flexta Polo", category:"Garments", price:2499, stock:40,
        images:["Polo"], desc:"Smart casual polo with breathable knit." },
      { id:6, title:"Flexta Chinos", category:"Bottoms", price:3199, stock:30,
        images:["Chinos"], desc:"Stretch chinos, sharp and comfy." },
    ];

    const cart = []; // {id, qty}

    // Navigation
    function navigate(page){
      for(const id of ["home","products","cart"]){
        document.getElementById("page-"+id).classList.toggle("hidden", id!==page);
      }
      if(page==="products") renderProducts();
      if(page==="home") renderFeatured();
      if(page==="cart") renderCart();
      window.scrollTo({top:0,behavior:"smooth"});
    }

    // Render featured (first 3)
    function renderFeatured(){
      const el = document.getElementById("featuredGrid");
      el.innerHTML = "";
      PRODUCTS.slice(0,3).forEach(p=> el.appendChild(productCard(p)) );
    }

    // Product card element
    function productCard(p){
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="img">${p.images[0]}</div>
        <div class="p16">
          <div class="row" style="justify-content:space-between">
            <div style="font-weight:600">${p.title}</div>
            ${p.badge ? `<span class="badge">${p.badge}</span>` : ""}
          </div>
          <div class="muted" style="margin-top:4px">${p.category}</div>
          <div class="row" style="margin-top:8px; justify-content:space-between; align-items:center">
            <div class="price">Rs ${p.price}</div>
            <button class="btn light" ${p.stock===0?"disabled":""} onclick="addToCart(${p.id})">
              ${p.stock===0?"Out of stock":"Add to cart"}
            </button>
          </div>
        </div>`;
      return card;
    }

    // Render products with filters
    function renderProducts(){
      const q = (document.getElementById("searchInput").value || "").toLowerCase();
      const cat = document.getElementById("catInput").value || "";
      const sort = document.getElementById("sortInput").value || "new";
      let items = PRODUCTS.filter(p =>
        (!cat || p.category===cat) &&
        (!q || p.title.toLowerCase().includes(q) || p.desc.toLowerCase().includes(q))
      );
      if(sort==="low") items.sort((a,b)=>a.price-b.price);
      else if(sort==="high") items.sort((a,b)=>b.price-a.price);
      else items.sort((a,b)=>b.id-a.id); // newest by id
      const grid = document.getElementById("productsGrid");
      grid.innerHTML = "";
      items.forEach(p=> grid.appendChild(productCard(p)));
    }

    // Cart ops
    function addToCart(id){
      const existing = cart.find(i=>i.id===id);
      if(existing){ existing.qty++; } else { cart.push({id, qty:1}); }
      updateCartCount();
      toast("Added to cart");
    }
    function removeFromCart(id){
      const idx = cart.findIndex(i=>i.id===id);
      if(idx>-1) cart.splice(idx,1);
      renderCart(); updateCartCount();
    }
    function updateQty(id, qty){
      const item = cart.find(i=>i.id===id);
      if(!item) return;
      item.qty = Math.max(1, qty);
      renderCart(); updateCartCount();
    }
    function updateCartCount(){
      const count = cart.reduce((s,i)=>s+i.qty,0);
      document.getElementById("cartCount").textContent = count;
      const total = cart.reduce((s,i)=> {
        const p = PRODUCTS.find(pp=>pp.id===i.id);
        return s + (p ? p.price * i.qty : 0);
      },0);
      document.getElementById("cartTotal").textContent = total;
    }

    // Render cart UI
    function renderCart(){
      const list = document.getElementById("cartList");
      list.innerHTML = "";
      if(cart.length===0){
        list.innerHTML = `<div class="muted">Your cart is empty.</div>`;
        document.getElementById("cartTotal").textContent = "0";
        return;
      }
      cart.forEach(i=>{
        const p = PRODUCTS.find(pp=>pp.id===i.id);
        const row = document.createElement("div");
        row.className = "card";
        row.innerHTML = `
          <div class="row p16" style="justify-content:space-between">
            <div>
              <div style="font-weight:600">${p.title}</div>
              <div class="muted">Rs ${p.price} × 
                <input type="number" min="1" value="${i.qty}" style="width:64px" 
                oninput="updateQty(${i.id}, Number(this.value))"/>
              </div>
            </div>
            <div class="row">
              <strong>Rs ${p.price * i.qty}</strong>
              <button class="btn" onclick="removeFromCart(${i.id})">Remove</button>
            </div>
          </div>`;
        list.appendChild(row);
      });
      updateCartCount();
    }

    // Checkout (demo only)
    function placeOrder(){
      const name = document.getElementById("name").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const address = document.getElementById("address").value.trim();
      if(!name || !phone || !address){
        toast("Please fill all checkout fields"); return;
      }
      if(cart.length===0){ toast("Cart is empty"); return; }
      const total = cart.reduce((s,i)=>{
        const p = PRODUCTS.find(pp=>pp.id===i.id); return s + (p?p.price*i.qty:0);
      },0);
      // Demo confirmation
      alert(`Order placed!\nName: ${name}\nPhone: ${phone}\nAddress: ${address}\nItems: ${cart.length}\nTotal: Rs ${total}\n\n(Static demo — no server needed)`);
      cart.splice(0,cart.length);
      updateCartCount();
      navigate('home');
    }

    // Tiny toast
    let toastTimer;
    function toast(msg){
      let t = document.getElementById("toast");
      if(!t){
        t = document.createElement("div");
        t.id="toast";
        t.style.position="fixed"; t.style.bottom="20px"; t.style.left="50%"; t.style.transform="translateX(-50%)";
        t.style.background="var(--dark)"; t.style.color="#fff"; t.style.padding="10px 14px"; t.style.borderRadius="999px";
        t.style.boxShadow="0 8px 24px rgba(17,24,39,.2)"; t.style.zIndex="50"; t.style.opacity="0"; t.style.transition="opacity .2s";
        document.body.appendChild(t);
      }
      t.textContent = msg; t.style.opacity="1";
      clearTimeout(toastTimer);
      toastTimer = setTimeout(()=> t.style.opacity="0", 1800);
    }

    // Init
    document.getElementById("year").textContent = new Date().getFullYear();
    navigate('home');
  </script>
</body>
</html>
